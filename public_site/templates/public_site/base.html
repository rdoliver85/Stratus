<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Stratus - Technology Career Platform{% endblock %}</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, #E0F2FE 0%, #FFFFFF 100%);
            min-height: 100vh;
        }
        
        .glass {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .glass-dark {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="glass sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <a href="{% url 'public_site:homepage' %}" class="text-2xl font-bold text-blue-600">Stratus</a>
                </div>
                
                <div class="hidden md:flex space-x-8">
                    <a href="{% url 'public_site:homepage' %}" class="text-gray-700 hover:text-blue-600 transition">Home</a>
                    <a href="{% url 'public_site:job_list' %}" class="text-gray-700 hover:text-blue-600 transition">Browse Jobs</a>
                    <a href="{% url 'public_site:job_list' %}?veteran_friendly=on" class="text-gray-700 hover:text-blue-600 transition">Veteran Jobs</a>
                </div>
                
                <div>
                    <a href="#" class="glass-dark px-4 py-2 rounded-lg text-blue-600 font-medium hover:shadow-md transition">Sign In</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="glass mt-20 py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <div>
                    <h3 class="text-xl font-bold text-blue-600 mb-4">Stratus</h3>
                    <p class="text-gray-600">Connecting technology talent with opportunity.</p>
                </div>
                <div>
                    <h4 class="font-semibold text-gray-900 mb-4">For Job Seekers</h4>
                    <ul class="space-y-2 text-gray-600">
                        <li><a href="{% url 'public_site:job_list' %}" class="hover:text-blue-600 transition">Browse Jobs</a></li>
                        <li><a href="{% url 'public_site:job_list' %}?veteran_friendly=on" class="hover:text-blue-600 transition">Veteran Opportunities</a></li>
                    </ul>
                </div>
                <div>
                    <h4 class="font-semibold text-gray-900 mb-4">About</h4>
                    <ul class="space-y-2 text-gray-600">
                        <li><a href="#" class="hover:text-blue-600 transition">About Stratus</a></li>
                        <li><a href="#" class="hover:text-blue-600 transition">Contact</a></li>
                    </ul>
                </div>
            </div>
            <div class="mt-8 pt-8 border-t border-gray-200 text-center text-gray-600">
                <p>&copy; 2025 Stratus. All rights reserved.</p>
            </div>
        </div>
    </footer>
</body>
</html>
